comment: The Leaflet Shared Component. Use this component to add OpenStreetMaps maps to you applications.
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import ''leaflet-defaulticon-compatibility'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public options: any = {
        		zoom: 7,
        		center: L.latLng(this.center.lat, this.center.lng)
        	};
        	public leafLayers: any = [];
        	public map: L.Map;
        	public searchControl: any = null;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		
        		this.options = {
        				zoom: this.zoom,
        				center: this.center?
        					L.latLng(this.center.lat, this.center.lng) : 
        					{ lat: 46.879966, lng: -121.726909}
        		};
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		var nextLayers = [];
        		if(this.layers != null){
        			for (let layer of this.layers) {
        				nextLayers.push(L.tileLayer(layer.source, layer.options));
        			}
        		}
        		if(this.markers != null){
        			for (let marker of this.markers) {
        				let m = L.marker(L.latLng(marker.lat, marker.lng), marker.options);
        				if (marker.tooltip) {
        					m.bindTooltip(marker.tooltip);
        				}
        				if (marker.popup) {
        					m.bindPopup(marker.popup);
        				}
        				nextLayers.push(m);
        			}
        		}
        		if(this.circles != null){
        			for (let circle of this.circles) {
        				let c = L.circle(L.latLng(circle.lat, circle.lng), circle.radius);
        				if (circle.tooltip) {
        					c.bindTooltip(circle.tooltip);
        				}
        				if (circle.popup) {
        					c.bindPopup(circle.popup);
        				}
        				nextLayers.push(c);
        			}
        		}
        		if(this.polygons != null){
        			for (let polygon of this.polygons) {
        				let polygonCoords = polygon && polygon.coord ? polygon.coord : polygon;
        				let polygonOptions = polygon && polygon.options ? polygon.options : undefined;
        				let p = L.polygon(polygonCoords, polygonOptions);
        				if (polygon && polygon.tooltip) {
        					p.bindTooltip(polygon.tooltip);
        				}
        				if (polygon && polygon.popup) {
        					p.bindPopup(polygon.popup);
        				}
        				nextLayers.push(p);
        			}
        		}
        		this.leafLayers = nextLayers;
        		if (this.center && typeof this.center.lat !== "undefined" && typeof this.center.lng !== "undefined") {
        			this.options.center = L.latLng(this.center.lat, this.center.lng);
        		}
        		if (typeof this.zoom !== "undefined" && this.zoom !== null) {
        			this.options.zoom = this.zoom;
        		}
        		if (changes.center && !changes.center.firstChange && this.map) {
        			this.map.setView(this.center, this.zoom != null ? this.zoom : this.map.getZoom());
        		}
        		if (changes.zoom && !changes.zoom.firstChange && this.map && this.zoom != null) {
        			this.map.setZoom(this.zoom);
        		}
        		if (changes.autoCenter && !changes.autoCenter.firstChange && this.map && this.autoCenter) {
        			this.centerOnCurrentPosition();
        		}
        		if (changes.geoCodeSearchAddress || changes.searchLabel) {
        			this.applyGeoSearchControl();
        		}
        		if (changes.disabled && !changes.disabled.firstChange && this.map) {
        			if(this.disabled){
        				this.disableInteractions();
        			}
        			else {
        				this.enableInteractions();
        			}
        		}
        
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	onMapReady(map: L.Map) {
        		this.map = map;
        		setTimeout(() => {
        			if (this.autoCenter) {
        				this.centerOnCurrentPosition();
        		    }
        			map.invalidateSize();
        			this.MapReady.emit(map);
        		}, 200);
        		
        		this.applyGeoSearchControl();
        		if(this.disabled){
        			this.disableInteractions();
        		}
        		else {
        			this.enableInteractions();
        		}
        		
        	}
        	private centerOnCurrentPosition(): void {
        		if (!this.map || !window.navigator || !window.navigator.geolocation) {
        			return;
        		}
        		window.navigator.geolocation.getCurrentPosition((position) => {
        			this.options.center = L.latLng(position.coords.latitude, position.coords.longitude);
        			this.map.setView(this.options.center, this.zoom != null ? this.zoom : this.map.getZoom());
        			this.c8o.log.warn("centered on current position", this.options.center);
        			this.GpsCentered.emit(this.options.center);
        		}, (error) => {
        			this.c8o.log.error(''Error getting location''+ error.message);
        		}, {
        			enableHighAccuracy: true,
        			timeout: 5000,
        			maximumAge: 300
        		});
        	}
        	private applyGeoSearchControl(): void {
        		if (!this.map) {
        			return;
        		}
        		if (this.searchControl) {
        			this.map.removeControl(this.searchControl);
        			this.searchControl = null;
        		}
        		if (this.geoCodeSearchAddress) {
        			const provider = new OpenStreetMapProvider();
        			this.searchControl = new (GeoSearch as any).GeoSearchControl({
        				provider: provider,
        				style: ''bar'',
        				//autoClose: true,
        				searchLabel: this.searchLabel,
        				showMarker: true,
        				showPopup: true,
        				autoComplete: true,
        				autoCompleteDelay: 250,
        				autoCompleteMinLength: 3,
        				autoCompletePosition: ''bottomautoComplete'',
        				autoCompleteCallback: (results) => {
        					if (results.length > 0) {
        						this.centerChange.emit(L.latLng(results[0].y, results[0].x));
        					}
        				}
        			});
        			this.map.addControl(this.searchControl);
        		}
        	}
        	private disableInteractions(): void {
        	    this.map.dragging.disable();
        	    this.map.touchZoom.disable();
        	    this.map.doubleClickZoom.disable();
        	    this.map.scrollWheelZoom.disable();
        	    this.map.boxZoom.disable();
        	    this.map.keyboard.disable();
        
        	    if (this.map["tap"]){
        			this.map["tap"].disable();
        		} 
        	  }
        	private enableInteractions(): void {
        	    this.map.dragging.enable();
        	    this.map.touchZoom.enable();
        	    this.map.doubleClickZoom.enable();
        	    this.map.scrollWheelZoom.enable();
        	    this.map.boxZoom.enable();
        	    this.map.keyboard.enable();
        
        	    if (this.map["tap"]){
        			this.map["tap"].enable();
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
